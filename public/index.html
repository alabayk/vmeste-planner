<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f486a8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Планер">
  <link rel="manifest" href="./manifest.webmanifest?v=11">
  <link rel="icon" href="./icon.svg?v=11">
  <link rel="apple-touch-icon" href="./icon.svg?v=11">
  <link rel="stylesheet" href="./styles.css?v=11">
  <link rel="stylesheet" href="./enhancements.css?v=32">
  <title>Планер</title>
</head>
<body>
  <section id="chooser">
    <div class="logo">ВК</div>
    <p class="eyebrow">планер для двоих</p>
    <h1>Кто ты?</h1>
    <div class="people">
      <button data-person="ksusha"><span>К</span></button>
      <button data-person="vanya"><span>В</span></button>
    </div>
    <small>Выбор сохранится на этом iPhone</small>
  </section>

  <main id="app" hidden>
    <header><div><p id="hello" class="eyebrow"></p><h1 id="dateTitle"></h1></div><button id="switch" class="round" aria-label="Выйти">↗</button></header>
    <section class="weekbar"><button id="prevWeek" aria-label="Предыдущая неделя">‹</button><div><strong id="weekRange"></strong><button id="todayButton" type="button">Сегодня</button></div><button id="nextWeek" aria-label="Следующая неделя">›</button></section>
    <nav id="days" aria-label="Дни недели"></nav>
    <nav id="allDates" aria-label="Даты всех планов" hidden></nav>
    <div id="offline" hidden>Офлайн · изменения сохранятся</div>
    <div id="spaces"></div>
    <p id="lastUpdated" class="lastUpdated"></p>
    <button id="add" aria-label="Добавить">＋</button>
    <footer><button class="active" data-view="day"><i>⌾</i><span>Календарь</span></button><button data-view="all"><i>≡</i><span>Все планы</span></button><button data-view="tasks"><i>✓</i><span>Дела</span></button></footer>
  </main>

  <dialog id="editor">
    <form id="eventForm">
      <i class="handle"></i>
      <div class="sheet"><div><p class="formEyebrow">Быстро и понятно</p><h2 id="formTitle">Новый план</h2></div><button id="closeEditor" type="button" class="close" aria-label="Закрыть">×</button></div>
      <input type="hidden" id="eventId">
      <label class="titleLabel">Что планируем?<input id="title" maxlength="120" required autocomplete="off" placeholder="Например, прогулка"></label>
      <div class="row eventTimes"><label>Начало<input id="startsAt" type="datetime-local" required></label><label>Конец<input id="endsAt" type="datetime-local" required></label></div>
      <label class="calendarField">Видимость<select id="space"></select><small>«Все» — событие видно вам обоим</small></label>
      <label>Заметка о событии <span class="optional">необязательно</span><textarea id="notes" maxlength="600" placeholder="Адрес, детали или идея…"></textarea></label>
      <div class="actions secondaryActions"><button id="copy" type="button" hidden>Копировать</button><button id="delete" type="button" hidden>Удалить</button></div>
      <div class="actions mainActions"><button id="cancelEditor" type="button">Отмена</button><button type="submit" class="primary">Сохранить</button></div>
    </form>
  </dialog>

  <dialog id="addChooser"><form><i class="handle"></i><div class="sheet"><h2>Что добавить?</h2><button id="closeAddChooser" type="button" class="close">×</button></div><div class="addKinds"><button id="addEventKind" type="button"><b>Событие</b><span>Начало, конец и календарь</span></button><button id="addDeadlineKind" type="button"><b>Дедлайн</b><span>Срок и напоминание</span></button></div></form></dialog>
  <dialog id="deadlineStub"><form id="deadlineForm"><i class="handle"></i><div class="sheet"><div><p class="formEyebrow">Не забыть важное</p><h2 id="deadlineFormTitle">Новый дедлайн</h2></div><button id="closeDeadline" type="button" class="close">×</button></div><input id="deadlineId" type="hidden"><label>Что нужно сделать?<input id="deadlineTitle" maxlength="120" required autocomplete="off" placeholder="Например, сдать проект"></label><label>Срок<input id="deadlineAt" type="datetime-local" required></label><label>Для кого<select id="deadlineOwner"><option value="personal">Для меня</option><option value="shared">Для нас двоих</option></select></label><label>Напомнить<select id="deadlineReminder"><option value="15">За 15 минут</option><option value="60">За час</option><option value="1440">За день</option><option value="0">Не напоминать</option></select></label><label>Заметка <span class="optional">необязательно</span><textarea id="deadlineNotes" maxlength="400" placeholder="Детали дедлайна…"></textarea></label><div class="actions secondaryActions"><button id="deleteDeadline" type="button" hidden>Удалить</button></div><div class="actions mainActions"><button id="cancelDeadline" type="button">Отмена</button><button type="submit" class="primary">Сохранить</button></div></form></dialog>

  <dialog id="login">
    <form id="loginForm">
      <i class="handle"></i>
      <div class="sheet"><div><p class="formEyebrow">Личный доступ</p><h2 id="loginTitle">Вход</h2></div><button id="closeLogin" type="button" class="close" aria-label="Закрыть">×</button></div>
      <label>PIN-код<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="current-password" required placeholder="8 цифр"></label>
      <p id="loginError" class="loginError" hidden></p>
      <div class="actions mainActions"><button id="cancelLogin" type="button">Отмена</button><button type="submit" class="primary">Войти</button></div>
    </form>
  </dialog>

  <dialog id="taskEditor">
    <form id="taskEditForm">
      <i class="handle"></i>
      <div class="sheet"><h2>Редактировать дело</h2><button id="closeTaskEditor" type="button" class="close" aria-label="Закрыть">×</button></div>
      <label>Название<input id="taskTitle" maxlength="120" required autocomplete="off"></label>
      <div class="actions mainActions"><button id="deleteTask" type="button">Удалить</button><button type="submit" class="primary">Сохранить</button></div>
    </form>
  </dialog>

  <template id="card"><article><button class="check" aria-label="Готово"></button><div class="cardBody"><time></time><h3></h3><p></p></div><button class="more" aria-label="Действия">•••</button></article></template>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./app.js?v=44"></script>
</body>
</html>
