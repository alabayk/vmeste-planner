<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f486a8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Планер">
  <link rel="manifest" href="./manifest.webmanifest?v=11">
  <link rel="icon" href="./icon.svg?v=11">
  <link rel="apple-touch-icon" href="./icon.svg?v=11">
  <link rel="stylesheet" href="./styles.css?v=11">
  <link rel="stylesheet" href="./enhancements.css?v=15">
  <title>Планер</title>
</head>
<body>
  <section id="chooser">
    <div class="logo">ВМ</div>
    <p class="eyebrow">планер для двоих</p>
    <h1>Кто ты?</h1>
    <div class="people">
      <button data-person="ksusha"><span>К</span>Ксюша</button>
      <button data-person="vanya"><span>В</span>Ваня</button>
    </div>
    <small>Выбор сохранится на этом iPhone</small>
  </section>

  <main id="app" hidden>
    <header><div><p id="hello" class="eyebrow"></p><h1 id="dateTitle"></h1></div><button id="today" class="round" aria-label="Сегодня">⌁</button></header>
    <section class="weekbar"><button id="prevWeek" aria-label="Предыдущая неделя">‹</button><div><strong id="weekRange"></strong><span>Неделя</span></div><button id="nextWeek" aria-label="Следующая неделя">›</button></section>
    <nav id="days" aria-label="Дни недели"></nav>
    <nav id="allDates" aria-label="Даты всех планов" hidden></nav>
    <div id="offline" hidden>Офлайн · изменения сохранятся</div>
    <div id="spaces"></div>
    <button id="add" aria-label="Добавить">＋</button>
    <footer><button class="active" data-view="day"><i>⌾</i><span>Сегодня</span></button><button data-view="all"><i>≡</i><span>Все планы</span></button><button id="switch"><i>↗</i><span>Выйти</span></button></footer>
  </main>

  <dialog id="editor">
    <form id="eventForm">
      <i class="handle"></i>
      <div class="sheet"><div><p class="formEyebrow">Быстро и понятно</p><h2 id="formTitle">Новый план</h2></div><button id="closeEditor" type="button" class="close" aria-label="Закрыть">×</button></div>
      <input type="hidden" id="eventId">
      <label class="titleLabel">Что планируем?<input id="title" maxlength="120" required autocomplete="off" placeholder="Например, прогулка"></label>
      <div class="row"><label>Когда<input id="startsAt" type="datetime-local" required></label><label>Минут<input id="duration" type="number" min="5" max="1440" step="5" value="30" required inputmode="numeric"></label></div>
      <div class="durationPresets" aria-label="Быстрая длительность"><button type="button" data-duration="30">30 мин</button><button type="button" data-duration="60">1 час</button><button type="button" data-duration="90">1,5 часа</button><button type="button" data-duration="120">2 часа</button></div>
      <label>Куда сохранить<select id="space"></select></label>
      <label>Заметка <span class="optional">необязательно</span><textarea id="notes" maxlength="600" placeholder="Адрес, детали или идея…"></textarea></label>
      <div class="actions secondaryActions"><button id="copy" type="button" hidden>Копировать</button><button id="delete" type="button" hidden>Удалить</button></div>
      <div class="actions mainActions"><button id="cancelEditor" type="button">Отмена</button><button type="submit" class="primary">Сохранить</button></div>
    </form>
  </dialog>

  <dialog id="login">
    <form id="loginForm">
      <i class="handle"></i>
      <div class="sheet"><div><p class="formEyebrow">Личный доступ</p><h2 id="loginTitle">Вход</h2></div><button id="closeLogin" type="button" class="close" aria-label="Закрыть">×</button></div>
      <label>PIN-код<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="current-password" required placeholder="8 цифр"></label>
      <p id="loginError" class="loginError" hidden></p>
      <div class="actions mainActions"><button id="cancelLogin" type="button">Отмена</button><button type="submit" class="primary">Войти</button></div>
    </form>
  </dialog>

  <template id="card"><article><button class="check" aria-label="Готово"></button><div class="cardBody"><time></time><h3></h3><p></p></div><button class="more" aria-label="Действия">•••</button></article></template>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./app.js?v=15"></script>
</body>
</html>
