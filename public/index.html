<!doctype html>
<style>[hidden]{display:none!important}</style>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f486a8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Вместе"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon.svg"><link rel="stylesheet" href="/styles.css"><title>Вместе</title></head>
<body><section id="chooser"><div class="logo">♥</div><p class="eyebrow">планер для двоих</p><h1>Кто ты?</h1><div class="people"><button data-person="ksusha"><span>К</span>Ксюша</button><button data-person="vanya"><span>В</span>Ваня</button></div><small>Выбор сохранится на этом iPhone</small></section>
<main id="app" hidden><header><div><p id="hello" class="eyebrow"></p><h1 id="dateTitle"></h1></div><button id="today" class="round" aria-label="Сегодня">⌁</button></header><nav id="days"></nav><div id="offline" hidden>Офлайн · изменения сохранятся</div><div id="spaces"></div><button id="add" aria-label="Добавить">＋</button><footer><button class="active" data-view="day">Сегодня</button><button data-view="all">Все планы</button><button id="switch">Сменить</button></footer></main>
<dialog id="editor"><form method="dialog" id="eventForm"><i class="handle"></i><div class="sheet"><h2 id="formTitle">Новый план</h2><button value="cancel" class="close">×</button></div><input type="hidden" id="eventId"><label>Что планируем?<input id="title" maxlength="120" required placeholder="Например, прогулка"></label><div class="row"><label>Когда<input id="startsAt" type="datetime-local" required></label><label>Минут<input id="duration" type="number" min="5" max="1440" step="5" value="30" required></label></div><label>Где<select id="space"></select></label><label>Заметка<textarea id="notes" maxlength="600" placeholder="Детали, адрес, идея…"></textarea></label><div class="actions"><button id="copy" type="button" hidden>Копировать</button><button id="delete" type="button" hidden>Удалить</button><button value="cancel">Отмена</button><button value="default" class="primary">Сохранить</button></div></form></dialog>
<template id="card"><article><button class="check" aria-label="Готово"></button><div class="cardBody"><time></time><h3></h3><p></p></div><button class="more" aria-label="Действия">•••</button></article></template><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="/app.js"></script></body></html>
